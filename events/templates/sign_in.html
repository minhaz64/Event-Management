<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <style>
      body {
        font-family: "inter", "San-serif";
      }
    </style>
  </head>

  <body class="relative min-h-screen">
    <div class="min-h-screen bg-gray-600">
      <!-- background image  -->
      <!-- <div class="fixed inset-0 backdrop-blur-sm -z-10 pointer-events-none"></div>
      <div class="relative"> -->
      <header>
        <nav class="relative top-0 left-0 w-full bg-white/[0.4] p-2 text-white font-bold backdrop-blur-md z-50">
          <div class="grid grid-cols-5 max-w-[1400px] mx-auto pt-2">
            <div class="col-span-1 md:col-span-2 lg:col-span-3">
              <img class="w-12 h-12 rounded-full drop-shadow-xl" src="images/LOGO.png" alt=""/>
            </div>
            <div class="flex justify-end items-center gap-4 col-span-4 md:col-span-3 lg:col-span-2">
              <span class="drop-shadow-lg hover:text-cyan-400">Home</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Events</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Categories</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Dashboard</span>
              <button class="p-2 bg-blue-600 rounded-xl text-white">Sign in</button>
            </div>
          </div>
        </nav>
      </header>

    <!-- MAIN CONTENT -->
    <main class="container max-w-[1400px] mx-auto px-10 py-20">
      <div class="bg-slate-200 shadow-lg rounded-xl p-8 mt-14 max-w-md mx-auto">
        <!-- form Title -->
        <div class="text-3xl font-bold text-gray-900 mb-6 text-center">
          Sign In
        </div>

        <!-- sign in form -->
        <form method="POST" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700" for="email">Email</label>

            <input class="p-1 mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-cyan-400 focus:ring focus:ring-cyan-300" type="email" id="email" name="email" placeholder="Enter your email" required />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700" for="password">Password</label>

            <input class="p-1 mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-cyan-400 focus:ring focus:ring-cyan-300" type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>

          <button
            type="submit"
            class="w-full px-6 py-3 bg-cyan-400 text-white rounded-lg hover:bg-cyan-500"
          >
            Log In
          </button>
        </form>

        <!-- Extra Links -->
        <div class="mt-4 text-center">
          <a href="#" class="text-sm text-cyan-600 hover:underline">Forgot Password?</a>
        </div>
        <div class="mt-2 text-center">
          <span class="text-sm text-gray-600">Don't have an account?</span>
          <a href="#" class="text-sm text-cyan-600 hover:underline">Sign Up</a>
        </div>
      </div>
    </main>
      
    </div>
    <!-- footer section  -->
    <footer class="bg-gray-900 text-white py-8">
      <div class="max-w-6xl mx-auto px-4 grid grid-rows-3 gap-6">
        <div class="flex flex-wrap gap-6 justify-center">
          <a href="#" class="hover:underline">About</a>
          <a href="#" class="hover:underline">Blogs</a>
          <a href="#" class="hover:underline">Events</a>
          <a href="#" class="hover:underline">Contact</a>
          <a href="#" class="hover:underline">Privacy Policy</a>
        </div>

        <div class="flex flex-wrap gap-6 justify-center">
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-facebook"></i
          ></a>
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-x-twitter"></i
          ></a>
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-instagram"></i
          ></a>
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-linkedin"></i
          ></a>
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-github"></i
          ></a>
        </div>

        <div class="flex justify-center items-center">
          <p class="text-sm text-gray-400">
            <i class="fa-solid fa-copyright"></i> 2025 Event Management. All
            rights reserved.
          </p>
        </div>
      </div>
  </footer>
  </body>
</html>

{% extends "template_page.html" %}
{% load static %}

{% block title %}Sign Up{% endblock title %}

{% block main %}
<main class="container max-w-[1400px] mx-auto px-10 py-20">
  <div class="max-w-md mx-auto bg-white shadow-md rounded-lg p-6 mb-10 mt-5">
    <div class="text-2xl font-bold text-center text-blue-600 mb-2">
      Create an Account
    </div>
    
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <!-- name  -->
      <div>
        <label class="block mb-1 text-gray-700 font-medium">Full Name</label>
        <input class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" type="text" name="name" placeholder="Your full name" required/>
      </div>
      <!-- Email  -->
      <div>
        <label class="block mb-1 text-gray-700 font-medium">Email</label>
        <input class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" type="email" name="email" placeholder="you@example.com" required/>
      </div>

      <!-- password  -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Password</label>
        <input class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" type="password" name="password" placeholder="********" required />
      </div>

      <!--  b-day -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Date of Birth</label>
        <input class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" type="date"required name="date_of_birth"/>
      </div>

      <!-- gender -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Gender</label>
        <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" name="gender" required>
          <option value="">Select gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <!-- Submit  -->
      <div>
        <button class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors" type="submit">
          Sign Up
        </button>
      </div>


       {% comment %} back to sign in  {% endcomment %}
       <div class="flex">
        <div class="text-center text-gray-600 text-sm">Already have an account? </div>
        <a href="{% url 'signin' %}" class="text-blue-600 hover:underline">Log in</a>
       </div>
      
    </form>
  </div>
</main>
{% endblock main %}

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <style>
      body {
        font-family: "inter", "San-serif";
      }
    </style>
  </head>

  <body class="relative min-h-screen">
    <div class="min-h-screen bg-gray-600">
      <!-- background image  -->
      <!-- <div class="fixed inset-0 backdrop-blur-sm -z-10 pointer-events-none"></div>
      <div class="relative"> -->
      <header>
        <nav class="relative top-0 left-0 w-full bg-white/[0.4] p-2 text-white font-bold backdrop-blur-md z-50">
          <div class="grid grid-cols-5 max-w-[1400px] mx-auto pt-2">
            <div class="col-span-1 md:col-span-2 lg:col-span-3">
              <img class="w-12 h-12 rounded-full drop-shadow-xl" src="images/LOGO.png" alt=""/>
            </div>
            <div class="flex justify-end items-center gap-4 col-span-4 md:col-span-3 lg:col-span-2">
              <span class="drop-shadow-lg hover:text-cyan-400">Home</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Events</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Categories</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Dashboard</span>
              <button class="p-2 bg-blue-600 rounded-xl text-white">Sign in</button>
            </div>
          </div>
        </nav>
      </header>

      <main class="container max-w-[1400px] mx-auto px-10 py-20">
        <div class="max-w-md mx-auto bg-white shadow-md rounded-lg p-6 mb-10 mt-5">
          <h2 class="text-2xl font-bold text-center text-blue-600 mb-2">
            Create an Account
          </h2>
          <form action="#" method="POST" class="space-y-4">
            <!-- Name -->
            <div>
              <label class="block text-gray-700 font-medium mb-1">Full Name</label>
              <input
                type="text"
                name="name"
                placeholder="Your full name"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                required
              />
            </div>
    
            <!-- Gender -->
            <div>
              <label class="block text-gray-700 font-medium mb-1">Gender</label>
              <select
                name="gender"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                required
              >
                <option value="">Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
    
            <!-- Birthday -->
            <div>
              <label class="block text-gray-700 font-medium mb-1">Birthday</label>
              <input
                type="date"
                name="birthday"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                required
              />
            </div>
    
            <!-- Email -->
            <div>
              <label class="block text-gray-700 font-medium mb-1">Email</label>
              <input
                type="email"
                name="email"
                placeholder="you@example.com"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                required
              />
            </div>
    
            <!-- Password -->
            <div>
              <label class="block text-gray-700 font-medium mb-1">Password</label>
              <input
                type="password"
                name="password"
                placeholder="••••••••"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                required
              />
            </div>
    
            <!-- Submit Button -->
            <div>
              <button
                type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors"
              >
                Sign Up
              </button>
            </div>
    
            <!-- Already have an account -->
            <p class="text-center text-gray-600 text-sm">
              Already have an account?
              <a href="/login" class="text-blue-600 hover:underline">Log In</a>
            </p>
          </form>
        </div>
      </main>
      
    </div>
    <!-- footer section  -->
    <footer class="bg-gray-900 text-white py-8">
      <div class="max-w-6xl mx-auto px-4 grid grid-rows-3 gap-6">
        <div class="flex flex-wrap gap-6 justify-center">
          <a href="#" class="hover:underline">About</a>
          <a href="#" class="hover:underline">Blogs</a>
          <a href="#" class="hover:underline">Events</a>
          <a href="#" class="hover:underline">Contact</a>
          <a href="#" class="hover:underline">Privacy Policy</a>
        </div>

        <div class="flex flex-wrap gap-6 justify-center">
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-facebook"></i
          ></a>
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-x-twitter"></i
          ></a>
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-instagram"></i
          ></a>
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-linkedin"></i
          ></a>
          <a href="#" class="hover:underline"
            ><i class="text-2xl fa-brands fa-github"></i
          ></a>
        </div>

        <div class="flex justify-center items-center">
          <p class="text-sm text-gray-400">
            <i class="fa-solid fa-copyright"></i> 2025 Event Management. All
            rights reserved.
          </p>
        </div>
      </div>
  </footer>
  </body>
</html>

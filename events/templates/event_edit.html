<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Edit</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <style>
      body {
        font-family: "inter", "San-serif";
      }
    </style>
  </head>

  <body class="relative min-h-screen">
    <div class="bg-gray-600">

      <header>
        <nav class="relative top-0 left-0 w-full bg-white/[0.4] p-2 text-white font-bold backdrop-blur-md z-50">
          <div class="grid grid-cols-5 max-w-[1400px] mx-auto pt-2">
            <div class="md:col-span-2 lg:col-span-3">
              <img class="w-12 h-12 rounded-full drop-shadow-xl" src="images/LOGO.png" alt=""/>
            </div>
            <div class="flex justify-end items-center gap-4 md:col-span-3 lg:col-span-2">
              <span class="drop-shadow-lg hover:text-cyan-400">Home</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Events</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Categories</span>
              <span class="drop-shadow-lg hover:text-cyan-400">Dashboard</span>
              <button class="p-2 bg-blue-600 rounded-xl text-white">Sign in</button>
            </div>
          </div>
        </nav>
      </header>

      <main class="container max-w-[1400px] mx-auto px-10 py-10">
        <div class="bg-slate-100 shadow-lg rounded-xl p-8 mt-5 max-w-3xl mx-auto">
          <h2 class="text-3xl font-bold text-gray-900 mb-6">Create a New Event</h2>
            <!-- event name -->
            <div>
              <label class="block text-gray-700 font-semibold mb-1">Event Name</label>
              <input type="text" name="name" placeholder="Enter event name"
                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-cyan-400" required>
            </div>

            <!-- description -->
            <div class="mb-6 mt-2">
              <label class="block text-gray-700 font-semibold mb-2">Description</label>
              <textarea name="description" rows="4" placeholder="Describe your event..."
                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-cyan-400" required></textarea>
            </div>
  
            <!-- date, time -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-gray-700 font-semibold mb-1">Date</label>
                <input type="date" name="date"
                  class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-cyan-400" required>
              </div>
              <div>
                <label class="block text-gray-700 font-semibold mb-1">Time</label>
                <input type="time" name="time" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-cyan-400" required>
              </div>
            </div>
  
            <!-- location -->
            <div class="mt-2">
              <label class="block text-gray-700 font-semibold mb-1">Location</label>
              <input type="text" name="location" placeholder="Enter event location"
                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-cyan-400" required>
            </div>
  
            <!-- category section -->
            <div class="mt-2 mb-4">
              <label class="block text-gray-700 font-semibold mb-2">Category</label>
              <select name="category" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-cyan-400" required>
                <option value="">Select a category</option>
                <option value="conference">Conference</option>
                <option value="workshop">Workshop</option>
                <option value="meetup">Meetup</option>
                <option value="concert">Concert</option>
                <option value="other">Other</option>
              </select>
            </div>
  
            <!-- submit -->
            <div>
              <button type="submit" class="px-6 py-3 bg-cyan-400 text-white font-semibold rounded-lg hover:bg-cyan-500 transition-colors">
                Edit Event
              </button>
            </div>
          </form>
        </div>
      </main>

      <!-- footer section  -->
      <footer class="bg-gray-900 text-white py-8">
        <div class="max-w-6xl mx-auto px-4 grid grid-rows-3 gap-6">
          <div class="flex flex-wrap gap-6 justify-center">
            <a href="#" class="hover:underline">About</a>
            <a href="#" class="hover:underline">Blogs</a>
            <a href="#" class="hover:underline">Events</a>
            <a href="#" class="hover:underline">Contact</a>
            <a href="#" class="hover:underline">Privacy Policy</a>
          </div>

          <div class="flex flex-wrap gap-6 justify-center">
            <a href="#" class="hover:underline"
              ><i class="text-2xl fa-brands fa-facebook"></i
            ></a>
            <a href="#" class="hover:underline"
              ><i class="text-2xl fa-brands fa-x-twitter"></i
            ></a>
            <a href="#" class="hover:underline"
              ><i class="text-2xl fa-brands fa-instagram"></i
            ></a>
            <a href="#" class="hover:underline"
              ><i class="text-2xl fa-brands fa-linkedin"></i
            ></a>
            <a href="#" class="hover:underline"
              ><i class="text-2xl fa-brands fa-github"></i
            ></a>
          </div>

          <div class="flex justify-center items-center">
            <p class="text-sm text-gray-400">
              <i class="fa-solid fa-copyright"></i> 2025 Event Management. All
              rights reserved.
            </p>
          </div>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>

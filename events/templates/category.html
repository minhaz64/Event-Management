{% extends "template_page.html" %}
{% load static %}

{% block title %}CATAGORY{% endblock title %}

    {% block main %}
      <main class="container max-w-[1400px] mx-auto px-10 mb-10">
        <div class="bg-slate-200 shadow-lg rounded-xl p-8 mt-10">
          <div class="text-3xl font-bold text-gray-900 mb-6">
            Create New Category
          </div>
  

          <form class="space-y-6" method="post">
            {% csrf_token %}
            <div>
              <label class="block text-sm font-medium text-gray-700" for="name">Category Name</label>

              <input class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-cyan-400 focus:ring focus:ring-cyan-300 py-1 px-2" type="text" id="categoryName" name="name" placeholder="Enter category name" required/>
            </div>
  

            <div>
              <label class="block text-sm font-medium text-gray-700" for="description">Description</label>

              <textarea class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-cyan-400 focus:ring focus:ring-cyan-300  py-1 px-2" id="categoryDescription" name="description" rows="3" placeholder="Short description" required></textarea>
            </div>
  
            <button class="px-6 py-3 bg-cyan-400 text-white rounded-lg hover:bg-cyan-500" type="submit">Create Category</button>
          </form>
        </div>
  
        
        <!-- All Category  -->
        <div class="bg-slate-200 shadow-lg rounded-xl p-8 mt-10">
          <div class="font-bold text-gray-900 text-2xl mb-6">All Categories</div>
  
          <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Category cards-->
            {% for c in categories %}
            <div class="bg-white p-6 rounded-lg shadow hover:shadow-lg transition">
              <div class="text-xl font-semibold mb-2">{{ c.name }}</div>
              <p class="text-gray-600 text-sm">
                {{ c.description }}
              </p>
            </div>
            {% endfor %}
          </div>
        </div>
      </main>
      {% endblock main %}
